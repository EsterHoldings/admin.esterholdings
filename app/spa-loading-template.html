<div class="admin-spa-loader" role="status" aria-live="polite" aria-label="Loading Ester Admin">
  <div class="admin-spa-loader__content">
    <div class="admin-spa-loader__logo">
      <img src="/favicon/favicon-192x192.png" alt="" width="72" height="72" />
    </div>
    <div class="admin-spa-loader__brand">ESTER</div>
    <div class="admin-spa-loader__bar" aria-hidden="true"><span></span></div>
  </div>
</div>

<style>
  html,
  body {
    margin: 0;
    min-height: 100%;
    background: #000028;
  }

  .admin-spa-loader {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 32px;
    box-sizing: border-box;
    overflow: hidden;
    color: #ffffff;
    background:
      radial-gradient(circle at 50% 42%, rgba(38, 101, 255, 0.22), transparent 34%),
      linear-gradient(180deg, #020a22 0%, #000028 58%, #00001c 100%);
    font-family:
      Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .admin-spa-loader__content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .admin-spa-loader__logo {
    display: grid;
    place-items: center;
    width: 96px;
    height: 96px;
    border: 1px solid rgba(91, 141, 255, 0.38);
    border-radius: 24px;
    background: rgba(8, 25, 65, 0.58);
    box-shadow:
      0 22px 70px rgba(0, 0, 0, 0.34),
      inset 0 0 24px rgba(93, 141, 255, 0.12);
    animation: admin-spa-logo-pulse 1.7s ease-in-out infinite;
  }

  .admin-spa-loader__logo img {
    width: 72px;
    height: 72px;
    object-fit: contain;
  }

  .admin-spa-loader__brand {
    color: rgba(255, 255, 255, 0.92);
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0;
  }

  .admin-spa-loader__bar {
    position: relative;
    width: min(180px, 48vw);
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
  }

  .admin-spa-loader__bar span {
    position: absolute;
    inset: 0;
    width: 42%;
    border-radius: inherit;
    background: linear-gradient(90deg, rgba(61, 117, 255, 0), #5287ff, rgba(255, 111, 49, 0.92));
    animation: admin-spa-bar 1.35s ease-in-out infinite;
  }

  @keyframes admin-spa-logo-pulse {
    0%,
    100% {
      opacity: 0.72;
      transform: scale(0.98);
    }

    50% {
      opacity: 1;
      transform: scale(1.02);
    }
  }

  @keyframes admin-spa-bar {
    0% {
      transform: translateX(-115%);
    }

    100% {
      transform: translateX(245%);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .admin-spa-loader__logo,
    .admin-spa-loader__bar span {
      animation: none;
    }
  }
</style>

<script>
  (() => {
    let observer;

    const removeWhenNuxtRendered = () => {
      const nuxtRoot = document.getElementById("__nuxt");
      const loader = document.querySelector(".admin-spa-loader");

      if (nuxtRoot && nuxtRoot.children.length > 0 && loader) {
        loader.remove();
        observer?.disconnect();
      }
    };

    removeWhenNuxtRendered();

    observer = new MutationObserver(removeWhenNuxtRendered);
    observer.observe(document.documentElement, { childList: true, subtree: true });
    window.addEventListener("load", () => setTimeout(removeWhenNuxtRendered, 0), { once: true });
  })();
</script>
